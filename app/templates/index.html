<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIFTY50 Options Analysis</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="mt-5">NIFTY50 Options Analysis</h1>
        <div class="row mt-4">
            <div class="col-md-6">
                <h2>NIFTY50 Data</h2>
                <form id="nifty-form">
                    <div class="form-group">
                        <label for="start-date">Start Date</label>
                        <input type="date" class="form-control" id="start-date" required>
                    </div>
                    <div class="form-group">
                        <label for="end-date">End Date</label>
                        <input type="date" class="form-control" id="end-date" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Download NIFTY50 Data</button>
                </form>
            </div>
            <div class="col-md-6">
                <h2>Options Data</h2>
                <form id="options-form">
                    <div class="form-group">
                        <label for="options-symbols">Options Symbols (comma-separated)</label>
                        <input type="text" class="form-control" id="options-symbols" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Download Options Data</button>
                </form>
                <div id="progress-container" class="mt-3" style="display: none;">
                    <p>Downloading options data...</p>
                    <div class="progress">
                        <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                    </div>
                </div>
            </div>
        </div>
        <div id="signals-container" class="mt-5" style="display: none;">
            <h2>Trading Signals</h2>
            <ul id="signals-list" class="list-group"></ul>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futures & Options Data Download</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Futures & Options Data Download</h1>
        <p><a href="/">Back to NIFTY50 Download</a></p>
        <div class="row mt-4">
            <div class="col-md-6">
                <h2>Futures Data</h2>
                <form id="futures-form">
                    <div class="form-group">
                        <label for="futures-symbol">Futures Symbol</label>
                        <select class="form-control" id="futures-symbol" required></select>
                    </div>
                    <div class="form-group">
                        <label for="start-date-futures">Start Date</label>
                        <input type="date" class="form-control" id="start-date-futures" required>
                    </div>
                    <div class="form-group">
                        <label for="end-date-futures">End Date</label>
                        <input type="date" class="form-control" id="end-date-futures" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Download Futures Data</button>
                </form>
            </div>
            <div class="col-md-6">
                <h2>Options Data</h2>
                <div id="option-chain-container"></div>
                <button id="download-options-btn" class="btn btn-primary mt-3" disabled>Download Selected Options</button>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#futures-symbol').select2();

            // Populate futures symbols
            $.get('/api/get_symbols', function(data) {
                const futuresSymbolDropdown = $('#futures-symbol');
                futuresSymbolDropdown.empty().append($('<option>-- Select Symbol --</option>').prop('disabled', true).prop('selected', true));
                data.symbols.forEach(function(symbol) {
                    futuresSymbolDropdown.append($('<option></option>').attr('value', symbol).text(symbol));
                });
            });

            function populateOptionChain() {
                const selectedSymbol = $('#futures-symbol').val();
                if (selectedSymbol) {
                    $.get('/api/get_option_chain?symbol=' + selectedSymbol, function(data) {
                        const container = $('#option-chain-container');
                        container.empty();
                        if (data.s === 'ok') {
                            const table = $('<table class="table table-striped"><thead><tr><th>CE</th><th>Strike</th><th>PE</th></tr></thead><tbody></tbody></table>');
                            const tbody = table.find('tbody');
                            data.d.option_chain.forEach(function(item) {
                                const row = $('<tr></tr>');
                                row.append($('<td><input type="checkbox" class="option-checkbox" data-symbol="' + item.ce_symbol + '"></td>'));
                                row.append($('<td>' + item.strike_price + '</td>'));
                                row.append($('<td><input type="checkbox" class="option-checkbox" data-symbol="' + item.pe_symbol + '"></td>'));
                                tbody.append(row);
                            });
                            container.append(table);
                            $('#download-options-btn').prop('disabled', false);
                        }
                    });
                }
            }

            $('#futures-symbol').change(populateOptionChain);

            // Handle forms submission
            $('#futures-form').submit(function(event) {
                event.preventDefault();
                // Futures download logic here
            });
            $('#download-options-btn').click(function(event) {
                event.preventDefault();
                const startDate = $('#start-date-futures').val();
                const endDate = $('#end-date-futures').val();

                $('.option-checkbox:checked').each(function() {
                    const symbol = $(this).data('symbol');
                    const parts = symbol.split(/(\d+)/);
                    const strike = parts[1];
                    const option_type = parts[2].slice(-2);
                    const expiry = parts[0].slice(0, -1); // Approximation

                    $.ajax({
                        url: '/download_options_data_new',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            symbol: symbol,
                            expiry: expiry,
                            strike: strike,
                            option_type: option_type,
                            start_date: startDate,
                            end_date: endDate
                        }),
                        success: function(response) { console.log(response.message); },
                        error: function(error) { console.error('Error downloading ' + symbol); }
                    });
                });
            });
        });
    </script>
</body>
</html>
